name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Compile host binary
        run: bun run build

      - name: Qualify compiled Stage 0 lifecycle
        run: bun run qualify:binary

      - name: Upload compiled binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dispatch-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
